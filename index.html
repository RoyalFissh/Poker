<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Ledger</title>
<style>
  :root{
    --felt-950:#0a2418;
    --felt-900:#0d2e1e;
    --felt-800:#123a26;
    --felt-700:#175030;
    --felt-600:#1d6b3c;
    --felt-500:#2c8a4f;
    --felt-400:#3fae66;
    --gold:#d4af37;
    --gold-dim:#8a7226;
    --ink-0:#0a0b0a;
    --ink-1:#141614;
    --ink-2:#1c201d;
    --ink-3:#262b26;
    --line:#333a34;
    --text-hi:#f2f0e6;
    --text-mid:#b9c2ba;
    --text-lo:#7c847d;
    --red:#c94040;
    --red-dim:#7a2b2b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #0e1a12 0%, var(--ink-0) 60%);
    color:var(--text-hi);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding:0 0 60px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}

  header{
    padding:28px 16px 20px;
    text-align:center;
    background:linear-gradient(180deg, var(--felt-900) 0%, rgba(13,46,30,0) 100%);
    border-bottom:1px solid var(--felt-700);
  }
  header h1{
    margin:0;
    font-size:22px;
    letter-spacing:0.02em;
    font-weight:700;
    color:var(--text-hi);
  }
  header h1 .suit{color:var(--gold);margin:0 6px;}
  header p{
    margin:6px 0 0;
    font-size:13px;
    color:var(--text-lo);
  }

  .section{margin-top:22px;}
  .section-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-lo);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .card{
    background:var(--ink-1);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }

  .add-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .add-form input{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px;
    color:var(--text-hi);
    font-size:14px;
    outline:none;
  }
  .add-form input:focus{border-color:var(--felt-500);}
  .add-form input::placeholder{color:var(--text-lo);}
  #name-input{flex:2;min-width:120px;}
  #buyin-input{flex:1;min-width:90px;}

  button{
    cursor:pointer;
    border:none;
    font-family:inherit;
    font-weight:600;
  }
  .btn-primary{
    background:var(--felt-600);
    color:var(--text-hi);
    border-radius:7px;
    padding:10px 18px;
    font-size:14px;
  }
  .btn-primary:hover{background:var(--felt-500);}
  .btn-primary:active{transform:scale(0.98);}

  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-mid);
    border-radius:7px;
    padding:8px 12px;
    font-size:13px;
  }
  .btn-ghost:hover{border-color:var(--felt-500);color:var(--text-hi);}

  .btn-danger{
    background:transparent;
    border:1px solid var(--red-dim);
    color:var(--red);
    border-radius:7px;
    padding:6px 10px;
    font-size:12px;
  }
  .btn-danger:hover{background:rgba(201,64,64,0.12);}

  .error{
    color:var(--red);
    font-size:12px;
    margin-top:8px;
  }

  .players{display:flex;flex-direction:column;gap:10px;}
  .player-row{
    background:var(--ink-1);
    border:1px solid var(--line);
    border-left:3px solid var(--felt-600);
    border-radius:9px;
    padding:14px 16px;
  }
  .player-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .player-name{font-size:16px;font-weight:700;color:var(--text-hi);}
  .player-total{font-size:12px;color:var(--text-lo);margin-top:2px;}

  .player-grid{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:end;
  }
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-lo);
    margin-bottom:4px;
    display:block;
  }
  .field-label .gold{color:var(--gold-dim);}
  .field input{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    color:var(--text-hi);
    font-size:14px;
    outline:none;
  }
  .field input:focus{border-color:var(--felt-500);}
  .field.stack input{border-color:var(--gold-dim);}
  .field.stack input:focus{border-color:var(--gold);}

  .rebuy-btn{
    background:var(--ink-3);
    border:1px solid var(--line);
    color:var(--text-mid);
    border-radius:7px;
    padding:9px 12px;
    font-size:13px;
    white-space:nowrap;
  }
  .rebuy-btn:hover{border-color:var(--felt-500);color:var(--text-hi);}

  .player-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .net{font-size:15px;font-weight:700;}
  .net.pos{color:var(--felt-400);}
  .net.neg{color:var(--red);}
  .net.zero{color:var(--text-lo);}
  .net-label{font-size:11px;color:var(--text-lo);font-weight:400;margin-right:6px;}

  .rebuy-list{
    font-size:12px;
    color:var(--text-lo);
    margin-top:4px;
  }

  .empty{
    text-align:center;
    color:var(--text-lo);
    font-size:14px;
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat{
    background:var(--ink-2);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-lo);}
  .stat-value{font-size:20px;font-weight:700;margin-top:4px;}
  .balance-ok{color:var(--felt-400);}
  .balance-off{color:var(--red);}

  .settle-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .settle-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--ink-2);
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
  }
  .settle-row .amt{
    margin-left:auto;
    color:var(--gold);
    font-weight:700;
  }
  .settle-row .from{color:var(--red);font-weight:600;}
  .settle-row .to{color:var(--felt-400);font-weight:600;}
  .settle-note{font-size:12px;color:var(--text-lo);margin-top:10px;}

  .toolbar{
    display:flex;
    gap:10px;
    margin-top:22px;
    justify-content:flex-end;
  }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(0);
    background:var(--felt-700);
    color:var(--text-hi);
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    border:1px solid var(--felt-500);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  @media (max-width:420px){
    .player-grid{grid-template-columns:1fr 1fr;}
    .rebuy-btn{grid-column:1/-1;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Poker <span class="suit">&spades;</span> Ledger</h1>
    <p>Buy-ins, rebuys, cash-outs, and who owes who</p>
  </header>

  <div class="section">
    <div class="section-title">Add a player</div>
    <div class="card">
      <div class="add-form">
        <input id="name-input" type="text" placeholder="Player name" maxlength="24">
        <input id="buyin-input" type="number" placeholder="Buy-in $" min="0" step="0.01">
        <button class="btn-primary" id="add-btn">Add player</button>
      </div>
      <div class="error" id="add-error" style="display:none;"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>Players</span>
      <span id="player-count" style="color:var(--text-lo);font-size:11px;"></span>
    </div>
    <div class="players" id="players-list"></div>
    <div class="empty" id="empty-state">No players yet. Add someone above to start the game.</div>
  </div>

  <div class="section">
    <div class="section-title">Game summary</div>
    <div class="card">
      <div class="summary-grid">
        <div class="stat">
          <div class="stat-label">Total buy-ins</div>
          <div class="stat-value" id="total-buyins">$0.00</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total on table</div>
          <div class="stat-value" id="total-stacks">$0.00</div>
        </div>
      </div>
      <div style="margin-top:10px;font-size:13px;" id="balance-line"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Settle up</div>
    <div class="card">
      <div id="settle-body"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-ghost" id="copy-btn">Copy summary</button>
    <button class="btn-ghost" id="reset-btn">New game</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var STORAGE_KEY = 'poker-ledger:current-game';
  var state = { players: [] };
  var nextId = 1;

  function fmt(n){
    var v = Math.round((n + Number.EPSILON) * 100) / 100;
    var neg = v < 0;
    var abs = Math.abs(v).toFixed(2);
    return (neg ? '-$' : '$') + abs;
  }

  function playerTotal(p){
    return p.buyins.reduce(function(sum, b){ return sum + b; }, 0);
  }

  function playerNet(p){
    if (p.finalStack === null || p.finalStack === undefined) return null;
    return p.finalStack - playerTotal(p);
  }

  function render(){
    var list = document.getElementById('players-list');
    var empty = document.getElementById('empty-state');
    var countEl = document.getElementById('player-count');
    list.innerHTML = '';

    if (state.players.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
    }
    countEl.textContent = state.players.length ? state.players.length + ' at the table' : '';

    state.players.forEach(function(p){
      var total = playerTotal(p);
      var net = playerNet(p);
      var row = document.createElement('div');
      row.className = 'player-row';

      var rebuyText = p.buyins.length > 1
        ? 'Buy-in ' + fmt(p.buyins[0]) + ' + ' + (p.buyins.length - 1) + ' rebuy' + (p.buyins.length - 1 > 1 ? 's' : '') + ' (' + p.buyins.slice(1).map(fmt).join(', ') + ')'
        : 'Buy-in ' + fmt(p.buyins[0]);

      var netClass = net === null ? 'zero' : (net > 0 ? 'pos' : (net < 0 ? 'neg' : 'zero'));
      var netText = net === null ? 'Awaiting cash-out' : fmt(net);

      row.innerHTML =
        '<div class="player-top">' +
          '<div>' +
            '<div class="player-name">' + escapeHtml(p.name) + '</div>' +
            '<div class="rebuy-list">' + rebuyText + '</div>' +
          '</div>' +
          '<button class="btn-danger" data-remove="' + p.id + '">Remove</button>' +
        '</div>' +
        '<div class="player-grid">' +
          '<div class="field">' +
            '<span class="field-label">Total in</span>' +
            '<input type="text" value="' + fmt(total) + '" disabled style="opacity:0.6;">' +
          '</div>' +
          '<div class="field stack">' +
            '<span class="field-label"><span class="gold">&#9679;</span> Final stack</span>' +
            '<input type="number" min="0" step="0.01" placeholder="0.00" data-stack="' + p.id + '" value="' + (p.finalStack === null || p.finalStack === undefined ? '' : p.finalStack) + '">' +
          '</div>' +
          '<button class="rebuy-btn" data-rebuy="' + p.id + '">+ Rebuy</button>' +
        '</div>' +
        '<div class="player-footer">' +
          '<span><span class="net-label">Net</span><span class="net ' + netClass + '">' + netText + '</span></span>' +
        '</div>';

      list.appendChild(row);
    });

    bindRowEvents();
    renderSummary();
    save();
  }

  function bindRowEvents(){
    document.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.onclick = function(){
        var id = Number(btn.getAttribute('data-remove'));
        state.players = state.players.filter(function(p){ return p.id !== id; });
        render();
      };
    });
    document.querySelectorAll('[data-rebuy]').forEach(function(btn){
      btn.onclick = function(){
        var id = Number(btn.getAttribute('data-rebuy'));
        var amtStr = prompt('Rebuy amount ($)');
        if (amtStr === null) return;
        var amt = parseFloat(amtStr);
        if (isNaN(amt) || amt <= 0){
          showToast('Enter a valid rebuy amount');
          return;
        }
        var p = state.players.find(function(p){ return p.id === id; });
        p.buyins.push(amt);
        render();
        showToast('Rebuy added for ' + p.name);
      };
    });
    document.querySelectorAll('[data-stack]').forEach(function(inp){
      inp.oninput = function(){
        var id = Number(inp.getAttribute('data-stack'));
        var p = state.players.find(function(p){ return p.id === id; });
        var v = inp.value === '' ? null : parseFloat(inp.value);
        p.finalStack = (v === null || isNaN(v)) ? null : v;
        renderSummary();
        save();
        updateNetInline(id);
      };
    });
  }

  function updateNetInline(id){
    var p = state.players.find(function(p){ return p.id === id; });
    var row = document.querySelector('[data-stack="' + id + '"]').closest('.player-row');
    var net = playerNet(p);
    var netEl = row.querySelector('.net');
    var netClass = net === null ? 'zero' : (net > 0 ? 'pos' : (net < 0 ? 'neg' : 'zero'));
    netEl.className = 'net ' + netClass;
    netEl.textContent = net === null ? 'Awaiting cash-out' : fmt(net);
  }

  function renderSummary(){
    var totalBuyins = state.players.reduce(function(s,p){ return s + playerTotal(p); }, 0);
    var stacksEntered = state.players.every(function(p){ return p.finalStack !== null && p.finalStack !== undefined; }) && state.players.length > 0;
    var totalStacks = state.players.reduce(function(s,p){ return s + (p.finalStack || 0); }, 0);

    document.getElementById('total-buyins').textContent = fmt(totalBuyins);
    document.getElementById('total-stacks').textContent = stacksEntered ? fmt(totalStacks) : fmt(totalStacks) + ' (partial)';

    var balanceLine = document.getElementById('balance-line');
    if (!stacksEntered || state.players.length === 0){
      balanceLine.innerHTML = '<span style="color:var(--text-lo);">Enter every final stack to check the balance.</span>';
    } else {
      var diff = Math.round((totalStacks - totalBuyins) * 100) / 100;
      if (Math.abs(diff) < 0.01){
        balanceLine.innerHTML = '<span class="balance-ok">Balanced &mdash; stacks match total buy-ins.</span>';
      } else {
        balanceLine.innerHTML = '<span class="balance-off">Off by ' + fmt(Math.abs(diff)) + ' (' + (diff > 0 ? 'stacks exceed buy-ins' : 'buy-ins exceed stacks') + '). Recount the chips.</span>';
      }
    }

    renderSettle(stacksEntered);
  }

  function renderSettle(stacksEntered){
    var body = document.getElementById('settle-body');
    if (state.players.length === 0){
      body.innerHTML = '<span style="color:var(--text-lo);font-size:13px;">Add players to see settlements.</span>';
      return;
    }
    if (!stacksEntered){
      body.innerHTML = '<span style="color:var(--text-lo);font-size:13px;">Waiting on final stacks from everyone.</span>';
      return;
    }

    var balances = state.players.map(function(p){
      return { name: p.name, net: Math.round(playerNet(p) * 100) / 100 };
    });

    var debtors = balances.filter(function(b){ return b.net < -0.004; }).map(function(b){ return { name: b.name, amt: -b.net }; });
    var creditors = balances.filter(function(b){ return b.net > 0.004; }).map(function(b){ return { name: b.name, amt: b.net }; });

    debtors.sort(function(a,b){ return b.amt - a.amt; });
    creditors.sort(function(a,b){ return b.amt - a.amt; });

    var transactions = [];
    var di = 0, ci = 0;
    while (di < debtors.length && ci < creditors.length){
      var d = debtors[di], c = creditors[ci];
      var amt = Math.min(d.amt, c.amt);
      if (amt > 0.004){
        transactions.push({ from: d.name, to: c.name, amt: amt });
      }
      d.amt -= amt;
      c.amt -= amt;
      if (d.amt <= 0.004) di++;
      if (c.amt <= 0.004) ci++;
    }

    if (transactions.length === 0){
      body.innerHTML = '<span style="color:var(--felt-400);font-size:14px;">Everyone broke even. Nobody owes anybody.</span>';
      return;
    }

    var html = '<div class="settle-list">';
    transactions.forEach(function(t){
      html += '<div class="settle-row"><span class="from">' + escapeHtml(t.from) + '</span><span>&#8594;</span><span class="to">' + escapeHtml(t.to) + '</span><span class="amt">' + fmt(t.amt) + '</span></div>';
    });
    html += '</div><div class="settle-note">Minimum number of transactions to settle the table.</div>';
    body.innerHTML = html;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ players: state.players, nextId: nextId }));
    }catch(e){}
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        state.players = parsed.players || [];
        nextId = parsed.nextId || (state.players.length ? Math.max.apply(null, state.players.map(function(p){return p.id;})) + 1 : 1);
      }
    }catch(e){}
    render();
  }

  document.getElementById('add-btn').onclick = function(){
    var nameInput = document.getElementById('name-input');
    var buyinInput = document.getElementById('buyin-input');
    var errEl = document.getElementById('add-error');
    var name = nameInput.value.trim();
    var buyin = parseFloat(buyinInput.value);

    if (!name){
      errEl.textContent = 'Enter a player name';
      errEl.style.display = 'block';
      return;
    }
    if (isNaN(buyin) || buyin <= 0){
      errEl.textContent = 'Enter a buy-in amount greater than $0';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    state.players.push({
      id: nextId++,
      name: name,
      buyins: [buyin],
      finalStack: null
    });
    nameInput.value = '';
    buyinInput.value = '';
    nameInput.focus();
    render();
  };

  document.getElementById('name-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('buyin-input').focus();
  });
  document.getElementById('buyin-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('add-btn').click();
  });

  document.getElementById('reset-btn').onclick = function(){
    if (state.players.length === 0) return;
    if (confirm('Start a new game? This clears the current table.')){
      state.players = [];
      nextId = 1;
      render();
      showToast('New game started');
    }
  };

  document.getElementById('copy-btn').onclick = function(){
    if (state.players.length === 0){
      showToast('Nothing to copy yet');
      return;
    }
    var lines = ['Poker Ledger'];
    state.players.forEach(function(p){
      var net = playerNet(p);
      lines.push(p.name + ': in ' + fmt(playerTotal(p)) + (p.finalStack != null ? ', out ' + fmt(p.finalStack) + ', net ' + fmt(net) : ', still playing'));
    });
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('Summary copied');
      }).catch(function(){
        showToast('Could not copy');
      });
    } else {
      showToast('Clipboard not available');
    }
  };

  load();
})();
</script>
</body>
</html>
